<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Deportiva - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="dashboard-body">
    <!-- Sidebar eliminado: navegación movida al encabezado superior -->

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="navbar-left">
                <div class="brand">
                    <i class="bi bi-trophy-fill" style="font-size: 24px;"></i>
                    <span id="empresaNombre">Academia Deportiva</span>
                </div>
                <!-- Botón hamburguesa para móvil -->
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="top-menu" id="topMenu">
                    <a href="#" class="menu-item active" data-module="dashboard"><i class="bi bi-speedometer2"></i>
                        Dashboard</a>
                    <!-- <a href="#" class="menu-item" data-module="deportes"><i class="bi bi-dribbble"></i> Deportes</a> -->
                    <a href="#" class="menu-item" data-module="membresias"><i class="bi bi-credit-card"></i>
                        Membresías</a>
                    <a href="#" class="menu-item" data-module="categorias"><i class="bi bi-tags"></i> Categorías</a>
                    <a href="#" class="menu-item" data-module="alumnos"><i class="bi bi-people"></i> Alumnos</a>
                    <a href="#" class="menu-item" data-module="evaluaciones"><i class="bi bi-clipboard-check"></i>
                        Evaluaciones</a>
                    <a href="#" class="menu-item" data-module="torneos"><i class="bi bi-trophy"></i> Torneos</a>
                    <a href="#" class="menu-item" data-module="asistencia"><i class="bi bi-check2-circle"></i>
                        Asistencia</a>
                    <a href="#" class="menu-item" data-module="inventario"><i class="bi bi-box-seam"></i> Inventario</a>
                    <a href="#" class="menu-item" data-module="ventas"><i class="bi bi-cart"></i> Ventas</a>
                    <a href="#" class="menu-item" data-module="gastos"><i class="bi bi-wallet2"></i> Gastos</a>
                    <a href="#" class="menu-item" data-module="reportes"><i class="bi bi-graph-up"></i> Reportes</a>

                    <a href="#" class="menu-item" data-module="configuracion"><i class="bi bi-gear"></i>
                        Configuración</a>

                </nav>

            </div>
            <div class="navbar-actions">
                <div class="user-info">
                    <span id="usuarioNombre" class="d-none d-md-inline"></span>
                    <div class="user-avatar" id="userAvatar">A</div>
                    <button class="btn btn-danger btn-sm" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="content-container" id="contentContainer">
                <!-- El contenido de cada módulo se cargará aquí -->
            </div>
        </div>
    </div>

    <!-- Overlay para cerrar menú en móvil -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="modules/dashboard.js"></script>
    <script src="modules/deportes.js"></script>
    <script src="modules/membresias.js"></script>
    <script src="modules/categorias.js"></script>
    <script src="modules/categorias-helpers.js"></script>
    <script src="modules/evaluaciones.js"></script>
    <script src="modules/evaluaciones-modales.js"></script>
    <script src="modules/alumnos.js"></script>
    <script src="modules/asistencia.js"></script>
    <script src="modules/inventario.js"></script>
    <script src="modules/ventas.js"></script>
    <script src="modules/pagos.js"></script>
    <script src="modules/gastos.js"></script>
    <script src="modules/reportes.js"></script>
    <script src="modules/torneos.js"></script>
    <script src="modules/usuarios.js"></script>

    <script src="modules/configuracion.js"></script>
    <script src="js/generar-datos-evaluaciones.js"></script>
    <script src="js/limpiar-y-regenerar.js"></script>
    <script src="js/generar-datos-cristiano.js"></script>
    <script src="js/generar-datos-carlos.js"></script>
</body>

</html>
