<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gráfico - Alumnos por Deporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-people"></i> Test: Alumnos por Deporte</h4>
            </div>
            <div class="card-body">
                <div style="height: 400px; padding: 15px;">
                    <canvas id="chartAlumnosPorDeporte"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de ejemplo
        const deportesEjemplo = [
            { nombre: 'Fútbol', alumnos: 25 },
            { nombre: 'Básquet', alumnos: 18 },
            { nombre: 'Vóley', alumnos: 15 },
            { nombre: 'Natación', alumnos: 12 },
            { nombre: 'Tenis', alumnos: 8 }
        ];

        // Paleta de colores vibrantes
        const coloresPaleta = [
            '#FF6B6B', // Rojo coral
            '#4ECDC4', // Turquesa
            '#45B7D1', // Azul cielo
            '#FFA07A', // Salmón
            '#98D8C8', // Verde menta
            '#F7DC6F', // Amarillo dorado
            '#BB8FCE', // Púrpura suave
            '#85C1E2', // Azul claro
            '#F8B739', // Naranja dorado
            '#52B788', // Verde esmeralda
        ];

        // Preparar datos
        const labels = deportesEjemplo.map(d => d.nombre);
        const datos = deportesEjemplo.map(d => d.alumnos);
        const colores = deportesEjemplo.map((d, i) => coloresPaleta[i % coloresPaleta.length]);

        // Crear gráfico
        const canvas = document.getElementById('chartAlumnosPorDeporte');
        const ctx = canvas.getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Cantidad de Alumnos',
                    data: datos,
                    backgroundColor: colores,
                    borderColor: colores,
                    borderWidth: 2,
                    borderRadius: 8,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)',
                        padding: 12,
                        titleFont: {
                            size: 14,
                            weight: 'bold'
                        },
                        bodyFont: {
                            size: 13
                        },
                        callbacks: {
                            label: function (context) {
                                return 'Alumnos: ' + context.parsed.y;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1,
                            font: {
                                size: 12
                            }
                        },
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)',
                            drawBorder: false
                        }
                    },
                    x: {
                        ticks: {
                            font: {
                                size: 12,
                                weight: '500'
                            },
                            color: '#333'
                        },
                        grid: {
                            display: false
                        }
                    }
                },
                animation: {
                    duration: 1000,
                    easing: 'easeInOutQuart'
                }
            }
        });
    </script>
</body>

</html>
